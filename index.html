<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>教培学员课时 &amp; 师资薪酬管理系统（云同步版）</title>
<style>
:root{
  --blue:#2f6fed; --blue-dark:#1e54c7; --blue-light:#e8f0fe;
  --green:#1fa35a; --green-light:#e3f6ec;
  --red:#e0483e; --red-light:#fdeceb;
  --orange:#e88b1a; --orange-light:#fdf2e0;
  --gray:#8a94a6; --gray-light:#f2f4f8;
  --text:#25324b; --text2:#5b6880; --line:#e6eaf2;
  --bg:#f4f6fa; --card:#ffffff;
  --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.55;}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:70px;}
.page{padding:14px 14px 20px;display:none;}
.page.active{display:block;}
/* 顶栏 */
.topbar{background:linear-gradient(135deg,#2f6fed,#5a8bff);color:#fff;padding:18px 16px 16px;border-radius:0 0 18px 18px;margin-bottom:12px;}
.topbar h1{font-size:18px;font-weight:600;display:flex;align-items:center;justify-content:space-between;}
.topbar .sub{font-size:12px;opacity:.85;margin-top:3px;}
.topbar .logout-btn{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff;font-size:12px;padding:4px 12px;border-radius:20px;cursor:pointer;}
/* 卡片 */
.card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(30,60,120,.06);}
.card h3{font-size:15px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;}
.card h3 .link{font-size:12px;color:var(--blue);font-weight:400;cursor:pointer;}
/* 统计 */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat{background:var(--card);border-radius:var(--radius);padding:12px 14px;box-shadow:0 1px 4px rgba(30,60,120,.06);}
.stat .k{font-size:12px;color:var(--text2);}
.stat .v{font-size:22px;font-weight:700;margin-top:2px;}
.stat.big{grid-column:1/3;background:linear-gradient(135deg,#25324b,#3a4d73);color:#fff;}
.stat.big .k{color:rgba(255,255,255,.75);}
.stat.big .v{font-size:28px;}
.stat .v.green{color:var(--green);} .stat .v.red{color:var(--red);} .stat .v.blue{color:var(--blue);}
.stat.big .v{color:#7ee2a8;}
/* 按钮 */
.btn{display:inline-block;background:var(--blue);color:#fff;border:none;border-radius:10px;padding:9px 16px;font-size:14px;cursor:pointer;font-family:inherit;}
.btn:active{opacity:.85;}
.btn.block{display:block;width:100%;text-align:center;}
.btn.ghost{background:var(--blue-light);color:var(--blue);}
.btn.danger{background:var(--red-light);color:var(--red);}
.btn.warn{background:var(--orange-light);color:var(--orange);}
.btn.ok{background:var(--green-light);color:var(--green);}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px;}
/* 列表行 */
.row{display:flex;align-items:center;justify-content:space-between;padding:11px 4px;border-bottom:1px solid var(--line);gap:8px;}
.row:last-child{border-bottom:none;}
.row .main{flex:1;min-width:0;}
.row .title{font-weight:600;font-size:14px;}
.row .desc{font-size:12px;color:var(--text2);margin-top:2px;word-break:break-all;}
.clickable{cursor:pointer;}
/* 徽章 */
.badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;white-space:nowrap;}
.badge.blue{background:var(--blue-light);color:var(--blue);}
.badge.green{background:var(--green-light);color:var(--green);}
.badge.red{background:var(--red-light);color:var(--red);}
.badge.orange{background:var(--orange-light);color:var(--orange);}
.badge.gray{background:var(--gray-light);color:var(--gray);}
/* 表单 */
.form-item{margin-bottom:12px;}
.form-item label{display:block;font-size:13px;color:var(--text2);margin-bottom:5px;}
.form-item input,.form-item select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;font-family:inherit;background:#fff;color:var(--text);}
.form-item input:focus,.form-item select:focus{outline:none;border-color:var(--blue);}
.form-inline{display:flex;gap:8px;}
.form-inline .form-item{flex:1;}
.hint{font-size:12px;color:var(--gray);margin-top:4px;}
/* 底部导航 */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:#fff;display:flex;border-top:1px solid var(--line);z-index:100;}
.tabbar .tab{flex:1;text-align:center;padding:8px 0 calc(8px + env(safe-area-inset-bottom));cursor:pointer;color:var(--gray);font-size:11px;}
.tabbar .tab .ico{font-size:20px;display:block;margin-bottom:1px;}
.tabbar .tab.active{color:var(--blue);font-weight:600;}
/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(15,25,50,.45);z-index:200;display:none;align-items:flex-end;justify-content:center;}
.mask.show{display:flex;}
.modal{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;max-height:88vh;overflow-y:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom));}
.modal h3{font-size:16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;}
.modal .close{font-size:22px;color:var(--gray);cursor:pointer;line-height:1;}
/* 登录页 */
.login-wrap{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:30px 26px;background:linear-gradient(160deg,#2f6fed 0%,#5a8bff 45%,#8fb4ff 100%);}
.login-card{background:#fff;border-radius:20px;padding:26px 22px;box-shadow:0 10px 30px rgba(10,30,80,.25);}
.login-card h2{text-align:center;font-size:19px;margin-bottom:4px;}
.login-card .sub{text-align:center;font-size:12px;color:var(--gray);margin-bottom:18px;}
.role-tabs{display:flex;background:var(--gray-light);border-radius:10px;padding:4px;margin-bottom:18px;}
.role-tabs div{flex:1;text-align:center;padding:8px 0;border-radius:8px;font-size:14px;cursor:pointer;color:var(--text2);}
.role-tabs div.active{background:#fff;color:var(--blue);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1);}
/* 日期chips */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.chip{background:var(--blue-light);color:var(--blue);border-radius:8px;padding:4px 10px;font-size:12px;display:flex;align-items:center;gap:5px;}
.chip .x{cursor:pointer;font-weight:700;}
/* 课时进度条 */
.pbar{height:7px;background:var(--gray-light);border-radius:5px;overflow:hidden;margin-top:7px;}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#2f6fed,#5a8bff);border-radius:5px;}
/* 家长端大数字 */
.big-hours{text-align:center;padding:10px 0 4px;}
.big-hours .num{font-size:56px;font-weight:800;color:var(--blue);line-height:1.1;}
.big-hours .unit{font-size:14px;color:var(--text2);}
.empty{text-align:center;color:var(--gray);font-size:13px;padding:26px 0;}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;}
table.tbl th{text-align:left;color:var(--text2);font-weight:500;font-size:12px;padding:6px 4px;border-bottom:1px solid var(--line);}
table.tbl td{padding:8px 4px;border-bottom:1px solid var(--line);}
.warn-tip{background:var(--orange-light);color:#9c5b00;font-size:12px;border-radius:10px;padding:8px 12px;margin-bottom:12px;line-height:1.6;}
.sec-title{font-size:13px;color:var(--text2);margin:16px 0 8px;display:flex;justify-content:space-between;align-items:center;}
.back-bar{display:flex;align-items:center;gap:8px;margin-bottom:12px;cursor:pointer;color:var(--blue);font-size:14px;font-weight:600;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   教培学员课时 & 师资薪酬管理系统（云同步版）
   数据存储：云端加密存储（GitHub 数据仓库 + AES-GCM 端到端加密）
   - 数据密文存于云端，任何设备登录同一账号即可同步
   - 家长端手机号+密码登录，可实时查看自家孩子剩余课时
   - 每次改动自动加密上传；浏览器本地保留密文缓存（离线可看）
   ========================================================= */
var STORE_KEY = 'peixiao_manager_v1';
var CLOUD_CFG = {
  rawUrls: [
    'https://chenziyi-dd.github.io/tuition-app/data.enc',
    'https://cdn.jsdelivr.net/gh/chenziyi-dd/tuition-app@main/data.enc',
    'https://raw.githubusercontent.com/chenziyi-dd/tuition-app/main/data.enc'
  ],
  apiData:  'https://api.github.com/repos/chenziyi-dd/tuition-app/contents/data.enc',
  pbkdf2Iter: 100000
};
/* 写入令牌：仅管理员设备需要，粘贴一次保存在本机浏览器，绝不上传网页/云端 */
function getWriteToken(){ return localStorage.getItem('peixiao_write_token')||''; }

/* ---------- 云端加密层（Web Crypto：PBKDF2 + AES-GCM） ---------- */
var CRYPTO = {
  te: new TextEncoder(), td: new TextDecoder(),
  b64: function(buf){ var b=new Uint8Array(buf), s=''; for(var i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); return btoa(s); },
  unb64: function(str){ var s=atob(str), b=new Uint8Array(s.length); for(var i=0;i<s.length;i++) b[i]=s.charCodeAt(i); return b; },
  hex: function(b){ var s=''; for(var i=0;i<b.length;i++) s+=(b[i]<16?'0':'')+b[i].toString(16); return s; },
  unhex: function(str){ var b=new Uint8Array(str.length/2); for(var i=0;i<b.length;i++) b[i]=parseInt(str.substr(i*2,2),16); return b; },
  /* 密码 → KEK（PBKDF2） */
  deriveKek: function(pass, saltBytes){
    var self=this;
    return crypto.subtle.importKey('raw', this.te.encode(pass), 'PBKDF2', false, ['deriveKey']).then(function(km){
      return crypto.subtle.deriveKey({name:'PBKDF2', salt:saltBytes, iterations:CLOUD_CFG.pbkdf2Iter, hash:'SHA-256'}, km,
        {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
    });
  },
  /* 用密码包裹主密钥（存储于云端，云端无法凭密文反推密码或数据） */
  wrapKey: function(pass, masterKeyBytes){
    var salt=crypto.getRandomValues(new Uint8Array(16));
    var iv=crypto.getRandomValues(new Uint8Array(12));
    var self=this;
    return this.deriveKek(pass, salt).then(function(kek){
      return crypto.subtle.encrypt({name:'AES-GCM', iv:iv}, kek, masterKeyBytes);
    }).then(function(wrapBuf){
      return {salt:self.hex(salt), iv:self.hex(iv), wrap:self.b64(wrapBuf)};
    });
  },
  /* 用密码解出主密钥（密码错误会抛异常） */
  unwrapKey: function(pass, acct){
    var self=this;
    return this.deriveKek(pass, this.unhex(acct.salt)).then(function(kek){
      return crypto.subtle.decrypt({name:'AES-GCM', iv:self.unhex(acct.iv)}, kek, self.unb64(acct.wrap));
    });
  },
  encryptJson: function(obj, masterKeyBytes){
    var iv=crypto.getRandomValues(new Uint8Array(12));
    var self=this;
    return crypto.subtle.importKey('raw', masterKeyBytes, 'AES-GCM', false, ['encrypt']).then(function(k){
      return crypto.subtle.encrypt({name:'AES-GCM', iv:iv}, k, self.te.encode(JSON.stringify(obj)));
    }).then(function(buf){
      return {iv:self.hex(iv), data:self.b64(buf)};
    });
  },
  decryptJson: function(blob, masterKeyBytes){
    var self=this;
    var ivHex = blob.dataIv || blob.iv;
    return crypto.subtle.importKey('raw', masterKeyBytes, 'AES-GCM', false, ['decrypt']).then(function(k){
      return crypto.subtle.decrypt({name:'AES-GCM', iv:self.unhex(ivHex)}, k, self.unb64(blob.data));
    }).then(function(buf){
      return JSON.parse(self.td.decode(buf));
    });
  },
  randomKey: function(){ return crypto.getRandomValues(new Uint8Array(32)); }
};

/* ---------- 云同步状态 ---------- */
var cloud = { blob:null, status:'未同步', pendingPush:false, masterKey:null, wrapCache:{}, lastSync:'' };
function cloudFetchOne(url){
  return fetch(url + (url.indexOf('?')<0?'?t=':'&t=') + Date.now(), {cache:'no-store'}).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.text();
  }).then(function(txt){
    txt = txt.trim();
    if(!txt || txt.indexOf('{')!==0) throw new Error('云端暂无数据');
    var blob = JSON.parse(txt);
    if(!blob.accounts) throw new Error('格式不正确');
    localStorage.setItem('peixiao_cloud_cache', JSON.stringify(blob));
    return blob;
  });
}
function cloudFetch(){
  var urls = CLOUD_CFG.rawUrls.slice();
  function tryNext(){
    if(!urls.length) return Promise.reject(new Error('所有云端通道均不可用'));
    return cloudFetchOne(urls.shift()).catch(function(){ return tryNext(); });
  }
  return tryNext();
}
function cloudFetchWithCache(){
  return cloudFetch().catch(function(e){
    var cached = localStorage.getItem('peixiao_cloud_cache');
    if(cached){ cloud.status='离线（使用本机缓存）'; return JSON.parse(cached); }
    return null;
  });
}
/* 根据当前数据重建账号表（管理员+每位家长手机号），密码有变化的账号重新包裹 */
function buildAccounts(){
  var jobs = [];
  var wanted = { admin: data.admin.pass };
  data.students.forEach(function(st){ if(st.phone) wanted[st.phone]=st.pass; });
  Object.keys(wanted).forEach(function(k){
    var cached = cloud.wrapCache[k];
    if(cached && cached.pass===wanted[k]){ jobs.push({key:k, acct:cached.acct}); return; }
    jobs.push(CRYPTO.wrapKey(wanted[k], cloud.masterKey).then(function(acct){
      cloud.wrapCache[k]={pass:wanted[k], acct:acct};
      return {key:k, acct:acct};
    }));
  });
  return Promise.all(jobs).then(function(list){
    var accounts={};
    list.forEach(function(j){ accounts[j.key]=j.acct; });
    return accounts;
  });
}
/* 加密并缓存 → 防抖上传云端 */
var pushTimer=null;
function saveData(){
  data.updatedAt = nowStr();
  if(session.role!=='admin'){ return; } /* 家长端只读，不回写云端 */
  buildAccounts().then(function(accounts){
    return CRYPTO.encryptJson(data, cloud.masterKey).then(function(enc){
      var blob = {v:1, ver:nowStr(), dataIv:enc.iv, data:enc.data, accounts:accounts};
      cloud.blob = blob;
      localStorage.setItem('peixiao_cloud_cache', JSON.stringify(blob));
      cloud.pendingPush = true;
      if(pushTimer) clearTimeout(pushTimer);
      cloud.status='已加密，待上传';
      pushTimer = setTimeout(function(){ cloudPush(true); }, 2500);
    });
  }).catch(function(e){ console.error('加密失败', e); cloud.status='加密失败：'+e.message; });
}
function cloudPush(silent){
  if(!cloud.pendingPush && !silent) { if(session.role==='admin') renderCloudStatus(); return; }
  var token = getWriteToken();
  if(!token){
    cloud.status='⚠️ 未配置同步令牌：数据已加密保存在本机，请到「设置→云端同步令牌」粘贴令牌后点击「立即上传」';
    if(!silent) alert(cloud.status);
    if(session.role==='admin') renderCloudStatus();
    return;
  }
  cloud.status='正在上传…';
  var payload = cloud.blob;
  if(!payload){ cloud.status='无待上传数据'; return; }
  fetch(CLOUD_CFG.apiData, {headers:{'Authorization':'token '+token}})
    .then(function(r){ return r.json(); })
    .then(function(info){
      var body = {
        message: '同步 '+payload.ver,
        content: btoa(unescape(encodeURIComponent(JSON.stringify(payload))))
      };
      if(info && info.sha) body.sha = info.sha;
      return fetch(CLOUD_CFG.apiData, {
        method:'PUT',
        keepalive:true,
        headers:{'Authorization':'token '+token, 'Content-Type':'application/json'},
        body: JSON.stringify(body)
      });
    })
    .then(function(r){
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.json();
    })
    .then(function(res){
      cloud.pendingPush=false; cloud.status='已同步'; cloud.lastSync=nowStr();
      if(session.role==='admin') renderCloudStatus();
      if(!silent) alert('✅ 已上传云端：'+ (res.commit? res.commit.sha.slice(0,7):''));
    })
    .catch(function(e){
      cloud.status='上传失败（已保留在本机，稍后自动重试）';
      if(!silent) alert('上传云端失败：'+e.message+'\n数据已加密保存在本机，下次保存时会自动重试。');
      if(session.role==='admin') renderCloudStatus();
    });
}
window.addEventListener('beforeunload', function(){ if(cloud.pendingPush){ clearTimeout(pushTimer); try{ cloudPush(true); }catch(e){} } });
function renderCloudStatus(){
  var el=document.getElementById('cloud-status');
  if(el) el.innerHTML='<b>'+cloud.status+'</b>'+(cloud.blob?' · 云端版本 '+cloud.blob.ver:'');
}

/* ---------- 工具函数 ---------- */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function pad(n){ return n<10 ? '0'+n : ''+n; }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function nowStr(){ var d=new Date(); return todayStr()+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function money(n){ n=Number(n)||0; return '¥'+n.toFixed(2).replace(/\.00$/,''); }
function weekName(i){ return ['日','一','二','三','四','五','六'][i]; }

/* ---------- 数据层 ---------- */
function defaultData(){
  return {
    admin:{ user:'admin', pass:'admin123' },
    teachers:[],   // {id,name,subject,rule:{base,per,cap},ruleHistory:[{time,oldRule,newRule}]}
    classes:[],    // {id,name,teacherId,course,dates:['YYYY-MM-DD'],createdAt} 预设班级：固定老师+课程+上课日期
    students:[],   // {id,name,phone,pass,enrollments:[{id,teacherId,course,classId?,enrollType,enrollDate,totalHours,totalFee,createdAt,sessions:[{date,status,lessonId}]}]}
    lessons:[],    // {id,teacherId,date,count,fee,items:[{studentId,enrollId,studentName,course}],ruleSnapshot}
    logs:[]        // {time,type,text}
  };
}
var data;
/* 数据迁移：兼容旧版本数据（云同步版：在解密后调用） */
function migrateData(){
  var changed = false;
  if(!Array.isArray(data.classes)){ data.classes = []; changed = true; }
  /* 旧版老师只有单一 rule → 迁移为规则列表（保留 t.rule 兼容显示） */
  data.teachers.forEach(function(t){
    if(!Array.isArray(t.rules) || !t.rules.length){
      var r = t.rule || {base:400, per:50, cap:6};
      t.rules = [{ id:uid(), name:'默认规则（按人数）', mode:'perHead',
                   base:r.base, per:r.per, cap:r.cap }];
      changed = true;
    }
  });
  data.students.forEach(function(st){
    st.enrollments.forEach(function(e){
      if(!e.enrollType){ e.enrollType = '新签'; changed = true; }
      if(!e.enrollDate){ e.enrollDate = (e.createdAt||nowStr()).slice(0,10); changed = true; }
    });
  });
  if(changed) saveData();
}
function addLog(type, text){ data.logs.unshift({time:nowStr(), type:type, text:text}); if(data.logs.length>3000) data.logs.length=3000; saveData(); }

function getTeacher(id){ for(var i=0;i<data.teachers.length;i++) if(data.teachers[i].id===id) return data.teachers[i]; return null; }
function getStudent(id){ for(var i=0;i<data.students.length;i++) if(data.students[i].id===id) return data.students[i]; return null; }

/* ---------- 薪酬计算 ----------
   规则支持两种模式：
   ① perHead 按人数（小班课）：base=基础课时费(1人)，per=每加1人加价，cap=满班封顶人数
      n人出勤 → base + (min(n,cap)-1)*per
   ② fixed 固定课时费（一对一）：fee=每节固定金额，不看人数
   旧数据无 mode 字段 → 默认按人数 */
function calcFee(rule, n){
  if(!rule) return 0;
  if(rule.mode==='fixed') return Number(rule.fee)||0;
  var cnt = Math.max(1, Math.min(n, rule.cap));
  return Number(rule.base) + (cnt-1)*Number(rule.per);
}
function feeDesc(rule){
  if(!rule) return '未设置';
  if(rule.mode==='fixed') return '固定'+money(rule.fee)+'/节（不论人数）';
  var s = '基础'+money(rule.base)+'/节，每加1人+'+money(rule.per);
  s += '，满班'+rule.cap+'人封顶'+money(calcFee(rule, rule.cap));
  return s;
}
/* 取报名所适用的计费规则：优先 enrollment.feeRuleId，其次老师第一条规则，再次旧版 teacher.rule */
function getFeeRule(e){
  var t = getTeacher(e.teacherId);
  if(!t) return null;
  if(e.feeRuleId && Array.isArray(t.rules)){
    for(var i=0;i<t.rules.length;i++) if(t.rules[i].id===e.feeRuleId) return t.rules[i];
  }
  if(Array.isArray(t.rules) && t.rules.length) return t.rules[0];
  if(t.rule) return {mode:'perHead', base:t.rule.base, per:t.rule.per, cap:t.rule.cap};
  return null;
}

/* ---------- 学员课时统计 ---------- */
function enrollStat(e){
  var total=e.sessions.length, used=0, absent=0, remain=0;
  e.sessions.forEach(function(s){ if(s.status==='attended')used++; else if(s.status==='absent')absent++; });
  remain = total - used;
  return {total:total, used:used, absent:absent, remain:remain};
}
function studentStat(st){
  var t=0,u=0,a=0;
  st.enrollments.forEach(function(e){ var s=enrollStat(e); t+=s.total; u+=s.used; a+=s.absent; });
  return {total:t, used:u, absent:a, remain:t-u};
}

/* ---------- 全局财务汇总 ---------- */
function financeSummary(){
  var feeIn=0;
  data.students.forEach(function(st){ st.enrollments.forEach(function(e){ feeIn += Number(e.totalFee)||0; }); });
  var feeOut=0, consumed=0;
  data.lessons.forEach(function(l){ feeOut += Number(l.fee)||0; consumed += l.items.length; });
  return { feeIn:feeIn, feeOut:feeOut, consumed:consumed, balance:feeIn-feeOut };
}
function teacherPaid(tid){
  var sum=0;
  data.lessons.forEach(function(l){ if(l.teacherId===tid) sum += Number(l.fee)||0; });
  return sum;
}

/* ---------- 月度报名统计（新签/续费，仅管理员可见） ----------
   ym 格式 'YYYY-MM'，按 enrollDate 归集 */
function monthlyStat(ym){
  var res = {newSum:0, renewSum:0, totalFee:0, newCount:0, renewCount:0, records:[]};
  data.students.forEach(function(st){
    st.enrollments.forEach(function(e){
      var d = e.enrollDate || (e.createdAt||'').slice(0,10);
      if(d.slice(0,7) === ym){
        var fee = Number(e.totalFee)||0;
        res.totalFee += fee;
        if(e.enrollType==='续费'){ res.renewSum += fee; res.renewCount++; }
        else { res.newSum += fee; res.newCount++; }
        var t = getTeacher(e.teacherId);
        res.records.push({student:st.name, course:e.course, type:e.enrollType||'新签', fee:fee, date:d, teacher:t?t.name:'-', stat:enrollStat(e)});
      }
    });
  });
  res.records.sort(function(a,b){ return a.date<b.date?1:-1; });
  /* 当月耗课与课时费（按上课日期归集，供对照） */
  res.consumed=0; res.feeOut=0;
  data.lessons.forEach(function(l){
    if((l.date||'').slice(0,7)===ym){ res.consumed += l.items.length; res.feeOut += Number(l.fee)||0; }
  });
  return res;
}
/* 所有出现过报名或耗课的月份列表（倒序） */
function allMonths(){
  var set = {};
  data.students.forEach(function(st){ st.enrollments.forEach(function(e){
    var d = e.enrollDate || (e.createdAt||'').slice(0,10);
    if(d) set[d.slice(0,7)] = 1;
  });});
  data.lessons.forEach(function(l){ if(l.date) set[l.date.slice(0,7)]=1; });
  return Object.keys(set).sort().reverse();
}

/* ---------- 核心：自动耗课 ----------
   扫描所有 status=pending 且 date<=今天 的课次：
   按【老师+日期+计费规则】分组视为同一节课（小班/一对一分开计费），
   按实际人数计算课时费，标记 attended 并生成 lesson 记录 + 日志留痕 */
function autoConsume(){
  var today = todayStr();
  var pendings = [];
  data.students.forEach(function(st){
    st.enrollments.forEach(function(e){
      e.sessions.forEach(function(sess){
        if(sess.status==='pending' && sess.date <= today){
          pendings.push({st:st, e:e, sess:sess, rule:getFeeRule(e)});
        }
      });
    });
  });
  if(!pendings.length) return false;
  var groups = {};
  pendings.forEach(function(it){
    var rid = it.rule && it.rule.id ? it.rule.id : null;
    var key = it.e.teacherId + '|' + it.sess.date + '|' + rid;
    (groups[key] = groups[key]||[]).push(it);
  });
  var consumedCount = 0;
  Object.keys(groups).forEach(function(key){
    var list = groups[key];
    var tid = list[0].e.teacherId;
    var t = getTeacher(tid);
    var rule = list[0].rule;
    var names = [];
    /* 若同一天同一老师同一规则已存在课次（如取消请假后恢复），并入原课重算课时费 */
    var lesson = null;
    var rid = rule && rule.id ? rule.id : null;
    data.lessons.forEach(function(l){
      if(l.teacherId===tid && l.date===list[0].sess.date && (l.ruleId||null)===rid) lesson=l;
    });
    var merged = !!lesson;
    if(!lesson){
      lesson = {
        id: uid(), teacherId: tid, date: list[0].sess.date,
        ruleId: rid, ruleName: rule ? rule.name : '默认规则',
        count: 0, fee: 0, items: [],
        ruleSnapshot: rule ? JSON.parse(JSON.stringify(rule)) : null
      };
    }
    list.forEach(function(it){
      it.sess.status = 'attended';
      it.sess.lessonId = lesson.id;
      lesson.items.push({studentId:it.st.id, enrollId:it.e.id, studentName:it.st.name, course:it.e.course});
      names.push(it.st.name);
      consumedCount++;
    });
    lesson.count = lesson.items.length;
    var useRule = lesson.ruleSnapshot || rule;
    var oldFee = lesson.fee;
    lesson.fee = useRule ? calcFee(useRule, lesson.count) : 0;
    if(!merged) data.lessons.push(lesson);
    var ruleTag = lesson.ruleName ? '【'+lesson.ruleName+'】' : '';
    if(merged){
      addLog('恢复上课', lesson.date+' '+(t?t.name+'('+t.subject+')':'')+'：'+names.join('、')+'并入本日班级'+ruleTag+'（出勤'+lesson.count+'人），课时费'+money(oldFee)+'→'+money(lesson.fee));
    }else{
      addLog('自动耗课', lesson.date+' '+(t?t.name+'('+t.subject+')':'未知老师')+'：出勤'+lesson.count+'人，课时费'+money(lesson.fee)+ruleTag+'（学员：'+names.join('、')+'）');
    }
  });
  saveData();
  return consumedCount;
}

/* ---------- 请假/恢复操作（留痕+联动财务） ---------- */
function markAbsent(stuId, enrollId, idx){
  var st=getStudent(stuId); if(!st) return;
  var e=null; st.enrollments.forEach(function(x){ if(x.id===enrollId) e=x; });
  if(!e) return;
  var sess = e.sessions[idx];
  var t = getTeacher(e.teacherId);
  if(sess.status==='attended'){
    // 补请假：从 lesson 中移除，重算该节课课时费
    var lesson=null;
    data.lessons.forEach(function(l){ if(l.id===sess.lessonId) lesson=l; });
    if(lesson){
      var removed = null;
      lesson.items = lesson.items.filter(function(it){ if(it.studentId===stuId && it.enrollId===enrollId){removed=it;return false;} return true; });
      if(removed){
        var rule = lesson.ruleSnapshot || (t?t.rule:null);
        lesson.count = lesson.items.length;
        var oldFee = lesson.fee;
        if(lesson.count===0){
          data.lessons = data.lessons.filter(function(l){ return l.id!==lesson.id; });
          addLog('补请假（撤销整节课）', lesson.date+' '+(t?t.name:'')+'：学员全部请假，原课时费'+money(oldFee)+'已撤销');
        }else{
          lesson.fee = rule ? calcFee(rule, lesson.count) : 0;
          addLog('补请假', lesson.date+' '+(t?t.name:'')+'：'+st.name+'请假，课时费'+money(oldFee)+'→'+money(lesson.fee));
        }
      }
    }
    sess.status='absent'; sess.lessonId=null;
    addLog('请假标记', st.name+' '+e.course+'（'+sess.date+'）标记为请假，本节不耗课');
  }else{
    sess.status='absent';
    addLog('请假标记', st.name+' '+e.course+'（'+sess.date+'）标记为请假，本节不耗课');
  }
  saveData();
  uiRefresh(stuId);
}
function cancelAbsent(stuId, enrollId, idx){
  var st=getStudent(stuId); if(!st) return;
  var e=null; st.enrollments.forEach(function(x){ if(x.id===enrollId) e=x; });
  if(!e) return;
  var sess = e.sessions[idx];
  var t = getTeacher(e.teacherId);
  sess.status='pending';
  addLog('取消请假', st.name+' '+e.course+'（'+sess.date+'）取消请假，恢复为待上课');
  saveData();
  autoConsume(); // 若日期已到，立即自动耗课
  uiRefresh(stuId);
}

function doLogin(){
  var btn = document.querySelector('.login-card .btn');
  if(btn){ btn.disabled=true; btn.textContent='正在验证…'; }
  if(loginRole==='admin'){
    var u=((document.getElementById('lg-user')||{}).value||'').trim()||'admin';

    var acct = cloud.blob.accounts['admin'];
    if(!acct){ alert('云端数据异常：缺少管理员账号'); restoreLoginBtn(); return; }
    CRYPTO.unwrapKey(p, acct).then(function(mk){
      cloud.masterKey = mk;
      return CRYPTO.decryptJson(cloud.blob, mk);
    }).then(function(d){
      if(d.admin && d.admin.user && u!==d.admin.user) throw new Error('账号名错误');
      data = d; migrateData();
      session={role:'admin',studentId:null};
      addLog('登录','管理员登录系统（云端同步版）');
      var n = autoConsume();
      currentView={name:'dashboard'}; renderAdmin();
      if(n) alert('系统已自动核算：到课日期已到且未标记请假的 '+n+' 节课，已自动耗课并计提课时费。');
    }).catch(function(){
      alert('密码错误');
      restoreLoginBtn();
    });
  }else{
    var ph=((document.getElementById('lg-phone')||{}).value||'').trim();
    var pp=(document.getElementById('lg-pass')||{}).value||'';

    if(!acct2){ alert('未找到该手机号对应的学员，请联系机构老师'); restoreLoginBtn(); return; }
    CRYPTO.unwrapKey(pp, acct2).then(function(mk){
      cloud.masterKey = mk;
      return CRYPTO.decryptJson(cloud.blob, mk);
    }).then(function(d){
      data = d;
      var st=null;
      data.students.forEach(function(s){ if(s.phone===ph) st=s; });
      if(!st) throw new Error('学员数据异常');
      session={role:'parent',studentId:st.id};
      currentView={name:'parentHome'};
      renderParent();
    }).catch(function(){
      alert('密码错误');
      restoreLoginBtn();
    });
  }
}

function onClassSel(){
  var cid=document.getElementById('f-en-class').value;
  var freeBox=document.getElementById('free-sched-box');
  var infoBox=document.getElementById('class-info-box');
  var feeBox=document.getElementById('class-fee-box');
  if(cid){
    var c=getClass(cid); if(!c) return;
    var t=getTeacher(c.teacherId);
    var rName='';
    if(c.feeRuleId && t && Array.isArray(t.rules)){
      t.rules.forEach(function(r){ if(r.id===c.feeRuleId) rName=r.name; });
    }
    freeBox.style.display='none'; feeBox.style.display='block'; infoBox.style.display='block';
    infoBox.innerHTML='<div class="card" style="background:var(--blue-light);box-shadow:none;margin-bottom:12px;">'+
      '<div style="font-size:14px;font-weight:600;">🏫 '+esc(c.name)+' <span class="badge blue">'+esc(t?t.name:'')+'</span> <span class="badge gray">'+c.dates.length+' 节课</span>'+(rName?' <span class="badge green">'+esc(rName)+'</span>':'')+'</div>'+
      '<div class="desc" style="font-size:12px;margin-top:4px;">课程：'+esc(c.course)+' · 首课 '+c.dates[0]+' ~ 末课 '+c.dates[c.dates.length-1]+'</div>'+
      '<div class="hint">上课日期与计费规则已按班级自动带出（见下方日期列表），报名后为独立副本</div></div>';
    tmpDates=c.dates.slice();
  }else{
    freeBox.style.display='block'; feeBox.style.display='none'; infoBox.style.display='none'; infoBox.innerHTML='';
    tmpDates=[];
  }
  renderChips();
}
function genDates(){
  var total=parseInt(document.getElementById('f-en-hours').value)||0;
  if(!total){ alert('请先填写总课时数'); return; }
  var days=[]; var checks=document.querySelectorAll('.wk-check');
  checks.forEach(function(c){ if(c.checked) days.push(parseInt(c.value)); });
  if(!days.length){ alert('请至少勾选一个上课星期'); return; }
  var start=document.getElementById('f-en-start').value;
  if(!start){ alert('请选择开始日期'); return; }
  tmpDates=[];
  var d=new Date(start+'T00:00:00');
  var guard=0;
  while(tmpDates.length<total && guard<800){
    if(days.indexOf(d.getDay())>=0) tmpDates.push(d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()));
    d.setDate(d.getDate()+1); guard++;
  }
  tmpDates.sort();
  renderChips();
}
function addOneDate(){
  var v=document.getElementById('f-en-1date').value;
  if(!v){ alert('请选择日期'); return; }
  if(tmpDates.indexOf(v)<0){ tmpDates.push(v); tmpDates.sort(); renderChips(); }
}
function delDate(i){ tmpDates.splice(i,1); renderChips(); }
function renderChips(){
  var el=document.getElementById('date-chips'); if(!el) return;
  el.innerHTML = tmpDates.length? tmpDates.map(function(d,i){
    return '<span class="chip">'+d+'<span class="x" onclick="delDate('+i+')">✕</span></span>';
  }).join('') : '<span class="hint">尚未添加日期</span>';
  el.innerHTML += '<div class="hint" style="width:100%;">已排 '+tmpDates.length+' 节</div>';
}
function saveEnrollment(stuId){
  var st=getStudent(stuId); if(!st) return;
  var cid=document.getElementById('f-en-class') ? document.getElementById('f-en-class').value : '';
  var tid, course, etype, edate, fee, rid;
  if(cid){
    /* 班级报名：老师/课程/课时/规则从班级带出 */
    var c=getClass(cid);
    if(!c){ alert('班级不存在，请重新选择'); return; }
    tid=c.teacherId; course=c.course; rid=c.feeRuleId;
    etype=document.getElementById('f-en-type2').value;
    edate=document.getElementById('f-en-date2').value||todayStr();
    fee=parseFloat(document.getElementById('f-en-fee2').value)||0;
    tmpDates=c.dates.slice();
  }else{
    tid=document.getElementById('f-en-teacher').value;
    rid=document.getElementById('f-en-rule').value;
    course=document.getElementById('f-en-course').value.trim();
    etype=document.getElementById('f-en-type').value;
    edate=document.getElementById('f-en-date').value||todayStr();
    fee=parseFloat(document.getElementById('f-en-fee').value)||0;
  }
  if(!course){ alert('请填写课程名称'); return; }
  if(!tmpDates.length){ alert('请生成或添加上课日期'); return; }
  var sessions = tmpDates.map(function(d){ return {date:d, status:'pending', lessonId:null}; });
  st.enrollments.push({
    id:uid(), teacherId:tid, course:course,
    classId: cid||null, feeRuleId: rid||null,
    enrollType:etype, enrollDate:edate,
    totalHours:tmpDates.length, totalFee:fee,
    createdAt:nowStr(), sessions:sessions
  });
  var t=getTeacher(tid);
  var cname=cid? '（班级：'+getClass(cid).name+'）':'';
  addLog('报名缴费', st.name+'【'+etype+'】报名「'+course+'」'+cname+'（'+(t?t.name:'')+'）：共'+tmpDates.length+'节课，学费'+money(fee)+'（'+edate+'），已录入 '+tmpDates.length+' 个上课日期');
  saveData(); closeModal();
  autoConsume();
  showStudentDetail(stuId);
}

function renderEdChips(){

function addEdDate(){
  var v=document.getElementById('f-ed-1date').value;
  if(!v){ alert('请选择日期'); return; }
  var dup=false; tmpSess.forEach(function(s){ if(s.date===v) dup=true; });
  if(dup){ alert('该日期已存在'); return; }
  tmpSess.push({date:v, status:'pending', lessonId:null});
  tmpSess.sort(function(a,b){ return a.date<b.date?-1:1; });
  renderEdChips();
}
function delEdDate(i){ if(tmpSess[i] && tmpSess[i].status==='attended'){ alert('已上课（已耗课）的课次不能删除，请先在课表中「标请假」'); return; } tmpSess.splice(i,1); renderEdChips(); }
function saveEnrollEdit(stuId, enrollId){
  var st=getStudent(stuId); if(!st) return;
  var e=null; st.enrollments.forEach(function(x){ if(x.id===enrollId) e=x; });
  if(!e) return;
  var etype=document.getElementById('f-ed-type').value;
  var edate=document.getElementById('f-ed-date').value||todayStr();
  var fee=parseFloat(document.getElementById('f-ed-fee').value);
  if(isNaN(fee)||fee<0){ alert('请填写正确的学费金额'); return; }
  var oldSummary = e.course+'·'+money(e.totalFee)+'·'+(e.enrollType||'新签');
  if(!e.classId){
    e.course=document.getElementById('f-ed-course').value.trim()||e.course;
    e.teacherId=document.getElementById('f-ed-teacher').value;
    e.feeRuleId=document.getElementById('f-ed-rule').value||null;
  }
  e.enrollType=etype; e.enrollDate=edate; e.totalFee=fee;
  e.sessions = tmpSess.map(function(s){ return {date:s.date, status:s.status, lessonId:s.lessonId}; });
  e.totalHours = e.sessions.length;
  addLog('修改报名', st.name+'「'+e.course+'」由 '+oldSummary+' 改为 '+e.course+'·'+money(fee)+'·'+etype+'；课次 '+e.totalHours+' 节（报名日期 '+edate+'）');
  saveData(); closeModal();
  autoConsume();
  showStudentDetail(stuId);
}
function delEnroll(stuId, enrollId){
  var st=getStudent(stuId); if(!st) return;
  var e=null; st.enrollments.forEach(function(x){ if(x.id===enrollId) e=x; });
  if(!e) return;
  var es=enrollStat(e);
  var attendedN=es.used;
  var t=getTeacher(e.teacherId);
  var msg='确认删除这条报名？\n\n'+st.name+' · '+e.course+'（'+(t?t.name:'')+'）\n总学费 '+money(e.totalFee)+' · 已耗课 '+attendedN+' 节 / 共 '+es.total+' 节';
  if(attendedN>0) msg+='\n\n⚠️ 其中 '+attendedN+' 节已核算课时费，删除后将一并撤销这些课时费记录';
  if(!confirm(msg)) return;
  /* 撤销该报名关联的所有课时费（扫描全部课次记录，含已不在课表中的历史引用） */
  data.lessons.slice().forEach(function(lesson){
    var before = lesson.items.length;
    lesson.items = lesson.items.filter(function(it){ return !(it.studentId===stuId && it.enrollId===enrollId); });
    if(lesson.items.length===before) return;
    var rule = lesson.ruleSnapshot || (getTeacher(lesson.teacherId)||{}).rule || null;
    lesson.count = lesson.items.length;
    if(lesson.count===0){
      data.lessons = data.lessons.filter(function(l){ return l.id!==lesson.id; });
      addLog('删除报名（撤销整节课）', lesson.date+' 因学员全部移除，课时费 '+money(lesson.fee)+' 已撤销');
    }else{
      var oldFee=lesson.fee;
      lesson.fee = rule ? calcFee(rule, lesson.count) : 0;
      addLog('删除报名（重算课费）', lesson.date+' 人数变为 '+lesson.count+' 人，课时费 '+money(oldFee)+'→'+money(lesson.fee));
    }
  });
  st.enrollments = st.enrollments.filter(function(x){ return x.id!==enrollId; });
  addLog('删除报名', st.name+'「'+e.course+'」整条报名已删除（学费 '+money(e.totalFee)+'）');
  saveData();
  showStudentDetail(stuId);
}

function renderFeeRuleSel(selId, tid, cur){
  var sel=document.getElementById(selId); if(!sel) return;
  var t=getTeacher(tid);
  var rules = t && Array.isArray(t.rules) ? t.rules : [];
  if(!rules.length && t && t.rule) rules=[{id:'legacy', name:'默认规则', mode:'perHead', base:t.rule.base, per:t.rule.per, cap:t.rule.cap}];
  var h='';
  rules.forEach(function(r){
    h+='<option value="'+r.id+'"'+(cur===r.id?' selected':'')+'>'+esc(r.name)+'（'+feeDesc(r)+'）</option>';
  });
  sel.innerHTML = h || '<option value="">该老师暂无规则</option>';
}
function genClassDates(){
  var total=parseInt(document.getElementById('f-cl-count').value)||0;
  if(!total){ alert('请先填写节数'); return; }
  var days=[]; var checks=document.querySelectorAll('.wk-check');
  checks.forEach(function(c){ if(c.checked) days.push(parseInt(c.value)); });
  if(!days.length){ alert('请至少勾选一个上课星期'); return; }
  var start=document.getElementById('f-cl-start').value;
  if(!start){ alert('请选择开始日期'); return; }
  tmpDates=[];
  var d=new Date(start+'T00:00:00');
  var guard=0;
  while(tmpDates.length<total && guard<800){
    if(days.indexOf(d.getDay())>=0) tmpDates.push(d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()));
    d.setDate(d.getDate()+1); guard++;
  }
  tmpDates.sort();
  renderChips();
}
function addClassOneDate(){
  var v=document.getElementById('f-cl-1date').value;
  if(!v){ alert('请选择日期'); return; }
  if(tmpDates.indexOf(v)<0){ tmpDates.push(v); tmpDates.sort(); renderChips(); }
}

function onRuleModeChange(i, mode){

function addRuleRow(){

function delRuleRow(i){

  renderRuleRows();
}
/* 从表单收集规则数据（保留原 id） */
function collectRuleRows(){
  var rows=document.querySelectorAll('#rule-list .rule-row');
  rows.forEach(function(row, i){
    if(!editRules[i]) return;
    var q=function(c){ return row.querySelector('.'+c); };
    editRules[i].name = q('r-name').value.trim() || ('规则'+(i+1));
    editRules[i].mode = q('r-mode').value;
    if(editRules[i].mode==='fixed'){
      editRules[i].fee = parseFloat(q('r-fee').value)||0;
    }else{
      editRules[i].base = parseFloat(q('r-base').value)||0;
      editRules[i].per = parseFloat(q('r-per').value)||0;
      editRules[i].cap = parseInt(q('r-cap').value)||1;
    }
  });
}
function saveTeacher(tid){
  var name=document.getElementById('f-t-name').value.trim();
  var subject=document.getElementById('f-t-subject').value.trim();
  if(!name||!subject){ alert('请填写老师姓名和科目'); return; }
  collectRuleRows();
  if(!editRules.length){ alert('请至少保留一条计费规则'); return; }
  if(tid){
    var t=getTeacher(tid);
    if(JSON.stringify(t.rules)!==JSON.stringify(editRules)){
      t.ruleHistory=t.ruleHistory||[];
      t.ruleHistory.push({time:nowStr(), oldRules:JSON.parse(JSON.stringify(t.rules)), newRules:JSON.parse(JSON.stringify(editRules))});
      var desc = editRules.map(function(r){ return r.name+'：'+feeDesc(r); }).join('；');
      addLog('规则修改', t.name+'（'+t.subject+'）规则更新 → '+desc);
    }
    t.name=name; t.subject=subject; t.rules=JSON.parse(JSON.stringify(editRules));
    t.rule = editRules[0].mode==='perHead' ? {base:editRules[0].base, per:editRules[0].per, cap:editRules[0].cap} : t.rule; /* 兼容字段 */
  }else{
    data.teachers.push({id:uid(), name:name, subject:subject, rules:JSON.parse(JSON.stringify(editRules)), ruleHistory:[]});
    addLog('新增老师', name+'（'+subject+'）：'+editRules.map(function(r){ return r.name+' '+feeDesc(r); }).join('；'));
  }
  saveData(); closeModal(); showTeachers();
}
function showTeacherLessons(tid){
  var t=getTeacher(tid); if(!t) return;
  var ls=data.lessons.filter(function(l){ return l.teacherId===tid; }).sort(function(a,b){ return a.date<b.date?1:-1; });
  var h='<div style="max-height:50vh;overflow-y:auto;">';
  if(!ls.length) h+='<div class="empty">暂无带课记录</div>';
  else ls.forEach(function(l){
    h+='<div class="row"><div class="main"><div class="title">'+l.date+' · 出勤 '+l.count+' 人'+(l.ruleName?' <span class="badge gray">'+esc(l.ruleName)+'</span>':'')+'</div>'+
    '<div class="desc">'+l.items.map(function(i){return esc(i.studentName)+'（'+esc(i.course)+'）';}).join('、')+'</div></div>'+
    '<span class="badge green">'+money(l.fee)+'</span></div>';
  });
  h+='</div>';
  openModal('📖 '+esc(t.name)+' 带课记录（'+ls.length+' 节，合计 '+money(teacherPaid(tid))+'）', h);
}

var reportMonth = null; // 'YYYY-MM'

  var el=document.getElementById('pg-report'); if(!el) return;

  var cur = todayStr().slice(0,7);
  if(!reportMonth) reportMonth = months.indexOf(cur)>=0 ? cur : (months[0]||cur);
  var ms = monthlyStat(reportMonth);
  var opts='';
  months.forEach(function(m){ opts+='<option value="'+m+'"'+(m===reportMonth?' selected':'')+'>'+m+'</option>'; });
  if(!months.length) opts='<option value="'+reportMonth+'">'+reportMonth+'</option>';
  var h=
  '<div class="topbar"><h1>📈 月度报名报表</h1><div class="sub">新签 / 续费统计 · 仅管理员可见</div></div>'+

  '<div class="hint">可查看任意历史月份</div></div></div>'+
  '<div class="stat-grid">'+
    '<div class="stat"><div class="k">新签总额</div><div class="v blue">'+money(ms.newSum)+'</div><div class="k">'+ms.newCount+' 笔</div></div>'+
    '<div class="stat"><div class="k">续费总额</div><div class="v green">'+money(ms.renewSum)+'</div><div class="k">'+ms.renewCount+' 笔</div></div>'+
    '<div class="stat"><div class="k">当月学费合计</div><div class="v">'+money(ms.totalFee)+'</div></div>'+
    '<div class="stat"><div class="k">当月耗课 / 课时费</div><div class="v" style="font-size:16px;">'+ms.consumed+' 节 / '+money(ms.feeOut)+'</div></div>'+
  '</div>'+
  '<div class="card"><h3>📋 '+reportMonth+' 报名明细（'+ms.records.length+' 笔）</h3>';
  if(!ms.records.length) h+='<div class="empty">本月无报名记录</div>';
  else{
    h+='<table class="tbl"><tr><th>报名日期</th><th>学员 / 课程</th><th>类型</th><th style="text-align:right;">学费</th></tr>';
    ms.records.forEach(function(r){
      var tc = r.type==='续费'?'green':'blue';
      h+='<tr><td>'+r.date.slice(5)+'</td><td><b>'+esc(r.student)+'</b><br><span style="font-size:12px;color:var(--text2);">'+esc(r.course)+' · '+esc(r.teacher)+'</span></td>'+
      '<td><span class="badge '+tc+'">'+r.type+'</span></td><td style="text-align:right;font-weight:600;">'+money(r.fee)+'</td></tr>';
    });

  el.innerHTML=h;
}

function saveWriteToken(){
  var t=(document.getElementById('s-token').value||'').trim();
  if(!t){ alert('请粘贴令牌（ghp_ 开头）'); return; }
  localStorage.setItem('peixiao_write_token', t);
  alert('✅ 令牌已保存到本机浏览器\n\n本设备后续改动将自动上传云端。');
  showSettings();
}
function changePass(){
  var o=document.getElementById('s-old').value, n=document.getElementById('s-new').value;
  if(o!==data.admin.pass){ alert('当前密码错误'); return; }
  if(n.length<6){ alert('新密码至少6位'); return; }
  data.admin.pass=n; saveData();
  addLog('登录','管理员修改了登录密码（加密钥匙已更新）');
  alert('密码已修改并加密上传云端\n\n请牢记新密码，并在其他设备用新密码登录。');
}
function exportData(){
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='教培课时薪酬数据备份_'+todayStr()+'.json';
  a.click();
}
function importData(input){
  var file=input.files[0]; if(!file) return;
  var reader=new FileReader();
  reader.onload=function(){
    try{
      var d=JSON.parse(reader.result);
      if(!d.admin||!d.students){ alert('文件格式不正确'); return; }
      if(!confirm('导入将覆盖当前全部数据，确定继续吗？')) return;
      data=d; saveData();
      addLog('数据导入','已导入备份文件（'+file.name+'）：学员'+data.students.length+'名，老师'+data.teachers.length+'名');
      autoConsume();
      alert('导入成功');
      currentView={name:'dashboard'}; renderAdmin();
    }catch(e){ alert('导入失败：'+e.message); }
  };
  reader.readAsText(file,'utf-8');
}
function clearAll(){
  if(!confirm('⚠️ 确认清空全部学员、老师、耗课与日志数据吗？此操作不可恢复！')) return;
  if(!confirm('再次确认：真的要清空全部数据吗？建议先导出备份！')) return;
  data=defaultData(); saveData();
  addLog('数据清空','系统数据已全部清空');
  alert('已清空');
  currentView={name:'dashboard'}; renderAdmin();
}

/* ---------- 通用弹窗 ---------- */
function openModal(title, bodyHtml){
  var mask=document.createElement('div');
  mask.className='mask show'; mask.id='modal-mask';
  mask.innerHTML='<div class="modal"><h3>'+title+'<span class="close" onclick="closeModal()">✕</span></h3>'+bodyHtml+'</div>';
  mask.addEventListener('click', function(e){ if(e.target===mask) closeModal(); });
  document.body.appendChild(mask);
}
function closeModal(){
  var m=document.getElementById('modal-mask');
  if(m) m.remove();
}

/* 首次初始化向导：设置管理员账号密码（可同时导入旧版本地数据） */

  '<div class="login-wrap"><div class="login-card">'+

  '<div style="font-size:13px;font-weight:600;margin-bottom:6px;">📥 从旧版本地数据迁移（可选）</div>'+
  '<div class="hint" style="margin-bottom:8px;">如果之前在「本地版」录入过数据：先在旧版「设置→导出全部数据」，再在此选择该 JSON 文件，学员/老师/耗课记录会全部带入云端</div>'+
  '<button class="btn ghost block" onclick="document.getElementById(\'ini-file\').click()">选择旧版备份 JSON（不选则从空白开始）</button>'+
  '<div id="ini-file-name" style="font-size:12px;color:var(--green,#07c160);margin-top:6px;"></div>'+
  '<input type="file" id="ini-file" accept=".json" style="display:none;" onchange="pickInitFile(this)"></div>'+
  '<div class="card" style="background:var(--gray-light);box-shadow:none;margin:12px 0;">'+
  '<div style="font-size:13px;font-weight:600;margin-bottom:6px;">🔐 云端同步令牌（管理员粘贴一次，仅存本机）</div>'+
  '<div class="form-item"><input id="ini-token" type="password" placeholder="ghp_ 开头的同步令牌"></div>'+
  '<div class="hint">用于把数据加密上传云端；只保存在这台设备，家长端不需要</div></div>'+
  '<button class="btn block" onclick="doInit()">初始化并启用云端同步</button>'+
  '</div></div>';
}
var initImported=null;
function pickInitFile(input){
  var f=input.files[0]; if(!f) return;
  var reader=new FileReader();
  reader.onload=function(){
    try{
      var d=JSON.parse(reader.result);
      if(!d.admin||!d.students) throw new Error('格式不正确');
      initImported=d;
      document.getElementById('ini-file-name').textContent='✅ 已读取：'+f.name+'（学员'+d.students.length+'名，老师'+d.teachers.length+'名）';
    }catch(e){ alert('读取失败：'+e.message); initImported=null; }
  };
  reader.readAsText(f,'utf-8');
}
function doInit(){
  var u=(document.getElementById('ini-user').value||'').trim()||'admin';
  var p=document.getElementById('ini-pass').value||'';
  var p2=document.getElementById('ini-pass2').value||'';
  if(p.length<6){ alert('管理员密码至少6位'); return; }
  if(p!==p2){ alert('两次输入的密码不一致'); return; }
  var btn=document.querySelector('.login-card .btn'); if(btn){btn.disabled=true;btn.textContent='正在初始化…';}
  var tk=(document.getElementById('ini-token').value||'').trim();
  if(tk) localStorage.setItem('peixiao_write_token', tk);
  if(initImported){
    data=initImported;
    data.admin.user=u; data.admin.pass=p;
    migrateData();
  }else{
    data=defaultData(); data.admin.user=u; data.admin.pass=p;
  }
  session={role:'admin',studentId:null};
  cloud.masterKey=CRYPTO.randomKey();
  cloud.pendingPush=true;
  saveData();
  /* 立即上传（不等防抖） */
  setTimeout(function(){ cloudPush(true); }, 1200);
  addLog('系统初始化','云端同步版初始化完成'+(initImported?'（已导入旧版数据：学员'+data.students.length+'名）':'（空白开始）'));
  currentView={name:'dashboard'};
  renderAdmin();
  alert('🎉 初始化成功！\n\n旧版数据已进入云端（如已选择备份文件）。\n现在可以在任意设备打开本网址，用刚设置的账号密码登录，数据自动同步。\n\n建议现在先到「设置」导出一份 JSON 备份。');
}
function boot(){
  renderLoading('正在从云端加载数据…');
  cloudFetchWithCache().then(function(blob){
    cloud.blob = blob;
    if(!blob || !blob.accounts || !blob.accounts.admin){ renderInit(); return; }
    /* 本机缓存 vs 云端版本比对：防止本机未上传的新数据被云端旧数据覆盖（2026-10-05 防丢失保护） */
    try{
      var cachedStr = localStorage.getItem('peixiao_cloud_cache');
      if(cachedStr && blob.ver){
        var cached = JSON.parse(cachedStr);
        if(cached && cached.ver && cached.ver > blob.ver && cached.accounts && cached.accounts.admin){
          var useLocal = confirm('⚠️ 检测到本机有未上传到云端的新数据！\n\n本机最后修改：'+cached.ver+'\n云端版本：'+blob.ver+'\n\n【确定】使用本机较新数据（推荐，登录后请尽快到「设置」配置同步令牌并上传）\n【取消】使用云端数据（本机未上传的修改将被丢弃）');
          if(useLocal){ cloud.blob = cached; cloud.pendingPush = true; cloud.status='已恢复本机较新数据（尚未上传云端）'; }
        }
      }
    }catch(e){ console.error('版本比对失败', e); }
    if(cloud.status!=='已恢复本机较新数据（尚未上传云端）') cloud.status = '已连接云端';
    renderLogin();
  }).catch(function(e){
    renderInit();
  });
}
boot();
/* 每60秒自动重试未成功的上传，防止数据滞留本机 */
setInterval(function(){ if(cloud.pendingPush){ try{ cloudPush(true); }catch(e){} } }, 60000);
</script>
